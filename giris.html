
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Giriş Yap | OtoBul</title>

  <style>
    body {
      margin: 0;
      background-color: #f2f6fa;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #1769aa;
      text-align: center;
      margin-top: 80px;
    }

    form {
      background-color: white;
      width: 320px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000018;
    }

    label, input {
      display: block;
      width: 100%;
      margin-bottom: 12px;
    }

    input {
      box-sizing: border-box;
      padding: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #1769aa;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>OtoBul'a Giriş Yap</h1>

  <form action="giris.php" method="POST">
    <p id="giris-hatasi" style="
    display:none;
    background-color:#fff1f0;
    color:#842029;
    border:1px solid #f5c2c7;
    padding:12px;
    border-radius:6px;
    text-align:center;
">
    ❌ E-posta veya şifre hatalı.
</p>
    <label for="eposta">E-posta</label>
    <input id="eposta" name="email" type="email" required>

    <label for="sifre">Şifre</label>
    <input id="sifre" name="sifre" type="password" required>
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
    <input type="checkbox" id="sifre-goster"
           style="width:auto; margin:0;"
           onclick="document.getElementById('sifre').type = this.checked ? 'text' : 'password';">
    Şifreyi Göster
</label>
    <p style="text-align: right;">
    <a href="sifremi-unuttum.html">Şifremi Unuttum?</a>
</p>

    <button type="submit">Giriş Yap</button>
    <p>Hesabınız yok mu? <a href="kayit.html">Kayıt Ol</a></p>
    <p><a href="index.html">Ana Sayfaya Dön</a></p>


  </form>
  <script>
    const parametreler = new URLSearchParams(window.location.search);

    if (parametreler.get("hata") === "1") {
        document.getElementById("giris-hatasi").style.display = "block";
    }
</script>



</body>
</html>

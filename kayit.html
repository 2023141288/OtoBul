
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol | OtoBul</title>

  <style>
    body {
      margin: 0;
      background-color: #f2f6fa;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #1769aa;
      text-align: center;
      margin-top: 80px;
    }

    form {
      background-color: white;
      width: 320px;
      max-width: calc(100% - 80px);
      margin: 30px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000018;
    }

    label, input {
      display: block;
      width: 100%;
      margin-bottom: 12px;
    }

    input {
      box-sizing: border-box;
      padding: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #1769aa;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .baglantilar {
      text-align: center;
      margin-top: 20px;
    }

    .baglantilar a {
      color: #1769aa;
    }
  </style>
</head>

<body>
  <h1>OtoBul'a Kayıt Ol</h1>

  <form action="kayit.php" method="POST">
    <p id="kayit-mesaji" style="
    display:none;
    padding:12px;
    border-radius:6px;
    text-align:center;
    font-size:14px;
"></p>
    <label for="ad">Ad Soyad</label>
    <input id="ad" name="ad_soyad" type="text" required>

    <label for="eposta">E-posta</label>
    <input id="eposta" name="email" type="email" required>

    <label for="sifre">Şifre</label>
    <input id="sifre" name="sifre" type="password" required>
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
    <input type="checkbox" id="sifre-goster"
           style="width:auto; margin:0;"
           onclick="document.getElementById('sifre').type = this.checked ? 'text' : 'password';">
    Şifreyi Göster
</label>

    <button type="submit">Kayıt Ol</button>

    <div class="baglantilar">
      <p>Zaten hesabınız var mı?
        <a href="giris.html">Giriş Yap</a>
      </p>
      <p><a href="index.html">Ana Sayfaya Dön</a></p>
    </div>
  </form>

    <script>
    const parametreler = new URLSearchParams(window.location.search);
    const mesajAlani = document.getElementById("kayit-mesaji");

    if (parametreler.get("hata") === "bilgiler") {
        mesajAlani.textContent = "❌ Bilgileri kontrol edin. Şifre en az 8 karakter olmalı.";
        mesajAlani.style.backgroundColor = "#fff1f0";
        mesajAlani.style.color = "#842029";
        mesajAlani.style.display = "block";
    }

    else if (parametreler.get("hata") === "eposta") {
        mesajAlani.textContent = "❌ Bu e-posta adresi zaten kayıtlı.";
        mesajAlani.style.backgroundColor = "#fff1f0";
        mesajAlani.style.color = "#842029";
        mesajAlani.style.display = "block";
    }

    else if (parametreler.get("basarili") === "1") {
        mesajAlani.textContent = "✅ Kaydınız başarıyla oluşturuldu. Giriş yapabilirsiniz.";
        mesajAlani.style.backgroundColor = "#d1e7dd";
        mesajAlani.style.color = "#0f5132";
        mesajAlani.style.display = "block";
    }
</script>


</body>
</html>

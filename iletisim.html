<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim - OtoBul</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
    }

    .ust-menu {
      background-color: #1769aa;
      padding: 16px 8%;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      background-color: white;
      color: #123b66;
      padding: 10px 16px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
    }

    .menu-yazisi {
      color: white;
      text-decoration: none;
    }

    .menu-yazisi:hover {
      text-decoration: underline;
    }

    .iletisim {
      max-width: 650px;
      margin: 60px auto;
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .iletisim h1 {
      color: #123b66;
      text-align: center;
    }

    .iletisim > p {
      color: #555;
      text-align: center;
      line-height: 1.6;
    }

    .iletisim-bilgileri {
      margin: 25px 0;
      padding: 15px;
      background-color: #f5f7fa;
      border-radius: 8px;
    }

    .iletisim-bilgileri p {
      margin: 8px 0;
      color: #444;
    }

    .iletisim h2 {
      color: #1769aa;
      margin-top: 30px;
    }

    .iletisim-formu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .iletisim-formu label {
      font-weight: bold;
      color: #123b66;
    }

    .iletisim-formu input,
    .iletisim-formu textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    .iletisim-formu textarea {
      min-height: 120px;
      resize: vertical;
    }

    .iletisim-formu button {
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background-color: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .iletisim-formu button:hover {
      background-color: #123b66;
    }
  </style>
</head>

<body>

  <nav class="ust-menu">
    <a class="logo" href="index.html">OtoBul</a>
    <a class="menu-yazisi" href="index.html">Ana Sayfa</a>
    <a class="menu-yazisi" href="hakkimizda.html">Hakkımızda</a>
    <a class="menu-yazisi" href="iletisim.html">İletişim</a>
  </nav>

  <main class="iletisim">

    <h1>İletişim</h1>

    <p>
      OtoBul ile ilgili görüş, öneri ve sorularınız için
      bizimle iletişime geçebilirsiniz.
    </p>

    <div class="iletisim-bilgileri">
      <p><strong>Platform:</strong> OtoBul</p>
      <p><strong>Geliştirici:</strong> Mesut Karslıoğlu</p>
      <p><strong>Konum:</strong> Sivas / Türkiye</p>
    </div>

    <h2>Bize Ulaşın</h2>

    <form class="iletisim-formu">

      <label for="ad">Ad Soyad</label>
      <input type="text" id="ad" name="ad" required>

      <label for="email">E-posta</label>
      <input type="email" id="email" name="email" required>



      <label for="mesaj">Mesajınız</label>
      <textarea id="mesaj" name="mesaj" required></textarea>

      <button type="submit">Mesaj Gönder</button>

    </form>

  </main>
<script>
  const form = document.querySelector(".iletisim-formu");

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    alert("Mesajınız alınmıştır. En kısa sürede dönüş yapılacaktır.");

    form.reset();
  });
</script>
</body>
</html>
